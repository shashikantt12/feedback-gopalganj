<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zorko Gopalganj Feedback</title><style>body{margin:0;background:#f4f4f4;font-family:system-ui,sans-serif}.card{max-width:520px;margin:20px auto;background:#fff;border-radius:22px;padding:28px 22px;box-shadow:0 8px 28px #0001}.brand{text-align:center;font-size:30px;font-weight:800}.sub{text-align:center;color:#666}h1{text-align:center}.stars{text-align:center;margin:22px}.star{font-size:42px;border:0;background:none;opacity:.35}.on{opacity:1}textarea{width:100%;height:130px;border:1px solid #ddd;border-radius:14px;padding:12px;font:inherit;box-sizing:border-box}.submit,.review{display:block;width:100%;padding:15px;border:0;border-radius:14px;background:#111;color:#fff;font-weight:700;font-size:16px;margin-top:18px;text-align:center;text-decoration:none;box-sizing:border-box}.thanks{display:none;text-align:center}.err{color:#b00020;text-align:center;display:none}</style></head><body><div class="card"><div class="brand">Zorko</div><div class="sub">Gopalganj</div><section id="form"><h1>How was your experience?</h1><p style="text-align:center;color:#555">Rate us and tell us what you think.</p><div class="stars"><button class="star" data-r="1">★</button><button class="star" data-r="2">★</button><button class="star" data-r="3">★</button><button class="star" data-r="4">★</button><button class="star" data-r="5">★</button></div><textarea id="text" placeholder="Write your feedback..."></textarea><div id="err" class="err">Please select a rating and write feedback.</div><button class="submit" id="submit">Submit &amp; Continue</button></section><section class="thanks" id="thanks"><h1>Thank you! ❤️</h1><p>Your feedback is recorded. Please continue to Google to publish your review.</p><a class="review" target="_blank" id="google">Write Google Review</a></section></div><script>let rating=0;document.querySelectorAll('.star').forEach(b=>b.onclick=()=>{rating=+b.dataset.r;document.querySelectorAll('.star').forEach(x=>x.classList.toggle('on',+x.dataset.r<=rating))});document.getElementById('submit').onclick=()=>{let t=document.getElementById('text').value.trim();if(!rating||!t){document.getElementById('err').style.display='block';return}document.getElementById('form').style.display='none';document.getElementById('thanks').style.display='block';document.getElementById('google').href='https://search.google.com/local/writereview?placeid=ChIJGzORc2kPkzkRM8lBAgE8JLw'};</script></body></html>
