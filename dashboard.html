<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zorko Gopalganj Dashboard</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f5f5;color:#171717}.wrap{max-width:900px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 4px 18px #0001}.big{font-size:30px;font-weight:800}.feedback{margin-top:14px}.empty{text-align:center;color:#777;padding:30px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>Zorko Gopalganj — Feedback Dashboard</h1><div class="grid"><div class="card"><div>Total feedback</div><div class="big" id="total">0</div></div><div class="card"><div>Average rating</div><div class="big" id="avg">—</div></div><div class="card"><div>Latest rating</div><div class="big" id="latest">—</div></div></div><div id="list"></div></div><script>const data=JSON.parse(localStorage.getItem('zorko_feedback_all')||'[]');document.getElementById('total').textContent=data.length;if(data.length){let avg=data.reduce((s,x)=>s+x.rating,0)/data.length;document.getElementById('avg').textContent=avg.toFixed(1)+' ★';document.getElementById('latest').textContent=data[0].rating+' ★';document.getElementById('list').innerHTML=data.map(x=>`<div class="card feedback"><b>${'★'.repeat(x.rating)}${'☆'.repeat(5-x.rating)}</b><p>${escapeHtml(x.feedback)}</p><small>${new Date(x.submittedAt).toLocaleString()}</small></div>`).join('')}else document.getElementById('list').innerHTML='<div class="card empty">No feedback stored on this browser yet.</div>';function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
